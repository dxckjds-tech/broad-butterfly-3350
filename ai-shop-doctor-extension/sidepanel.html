<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 店铺医生</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    font-family: 'Noto Sans SC', system-ui, sans-serif;
    font-size: 13px;
    color: #1A2433;
    background: #FFFFFF;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #D8DCE2; border-radius: 3px; }

  /* Layout */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* Address bar */
  .addr-bar {
    height: 28px;
    flex: none;
    background: #F5F6F8;
    border-bottom: 1px solid #E2E5EA;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
  }
  .addr-dot { width: 6px; height: 6px; border-radius: 50%; background: #0E8E82; flex: none; }
  .addr-text { font-size: 9.5px; color: #8B95A1; font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Header */
  .panel-header {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    border-bottom: 1px solid #E2E5EA;
  }
  .panel-title { display: flex; align-items: center; gap: 7px; }
  .panel-title-dot { width: 7px; height: 7px; border-radius: 50%; background: #0E8E82; }
  .panel-title-text { font-size: 13.5px; font-weight: 700; color: #0F2540; }
  .scene-badge {
    font-size: 10px; font-weight: 600; color: #0E8E82;
    background: #EFF9F7; border: 1px solid #C7E6E1;
    border-radius: 11px; padding: 4px 8px;
    cursor: pointer; white-space: nowrap;
    transition: background 0.15s;
  }
  .scene-badge:hover { background: #DCF3EF; }

  /* Summary bar */
  .summary-bar {
    flex: none;
    padding: 11px 14px;
    border-bottom: 1px solid #E2E5EA;
    background: #F7F9FA;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .summary-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .summary-name { font-size: 12.5px; font-weight: 700; color: #0F2540; line-height: 1.35; overflow-wrap: break-word; }
  .summary-pct { font-size: 12.5px; font-weight: 700; color: #0E8E82; white-space: nowrap; flex: none; }
  .status-chip {
    font-size: 10px; font-weight: 700;
    border-radius: 4px; padding: 2px 7px;
    display: inline-block;
  }
  .chip-conflict { background: #FDEAEA; color: #C63C3C; border: 1px solid #F5C2C2; }
  .chip-confirmed { background: #EAF7EF; color: #1C9A5A; border: 1px solid #BEE8CB; }
  .summary-sub { font-size: 10px; color: #5B6472; }

  /* Tabs */
  .tab-bar { display: flex; flex: none; border-bottom: 1px solid #E2E5EA; }
  .tab-btn {
    flex: 1; text-align: center; padding: 9px 1px;
    font-size: 10.5px; font-weight: 600;
    cursor: pointer; background: transparent; color: #5B6472;
    border: none; outline: none;
    transition: background 0.15s, color 0.15s;
  }
  .tab-btn.active { background: #0F2540; color: #FFFFFF; }
  .tab-btn:hover:not(.active) { background: #F1F2F4; }

  /* Content area */
  .content-area {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Bottom bar */
  .bottom-bar {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid #E2E5EA;
  }
  .btn-ghost {
    flex: 1; text-align: center; font-size: 11px; font-weight: 600;
    color: #0F2540; border: 1px solid #D8DCE2; border-radius: 6px;
    padding: 8px 0; cursor: pointer; background: #FFFFFF;
    transition: background 0.15s;
  }
  .btn-ghost:hover { background: #F7F8FA; }
  .btn-primary {
    flex: 1; text-align: center; font-size: 11px; font-weight: 600;
    color: #FFFFFF; background: #0F2540; border-radius: 6px;
    padding: 8px 0; cursor: pointer; border: none;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: #162D4E; }

  /* Cards */
  .card {
    border: 1px solid #E2E5EA; border-radius: 8px;
    padding: 12px;
    background: #FFFFFF;
  }
  .card-title { font-size: 11px; font-weight: 700; color: #5B6472; text-transform: uppercase; margin-bottom: 7px; }

  /* Alert cards */
  .alert-conflict {
    border: 1px solid #F5C2C2; background: #FDEAEA;
    border-radius: 8px; padding: 12px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .alert-conflict-title { font-size: 11.5px; font-weight: 700; color: #C63C3C; }
  .alert-conflict-body { font-size: 11.5px; color: #8A3030; line-height: 1.5; overflow-wrap: break-word; }
  .alert-success {
    border: 1px solid #BEE8CB; background: #EAF7EF;
    border-radius: 8px; padding: 12px;
    font-size: 11.5px; color: #1C6E42; line-height: 1.5;
  }
  .alert-unavailable {
    border: 1px solid #DCE0E5; background: #F1F2F4;
    border-radius: 8px; padding: 12px;
    font-size: 11.5px; color: #6B7280; line-height: 1.6;
  }

  /* Metric bars */
  .metric-row { display: flex; flex-direction: column; gap: 4px; }
  .metric-label { display: flex; justify-content: space-between; font-size: 11.5px; color: #3A4250; }
  .metric-track { height: 5px; border-radius: 3px; background: #EEF0F3; overflow: hidden; }
  .metric-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

  /* Status badge */
  .badge {
    font-size: 9.5px; font-weight: 700;
    border-radius: 4px; padding: 2px 5px;
    white-space: nowrap; display: inline-block;
  }
  .badge-verified { background: #EAF7EF; color: #1C9A5A; border: 1px solid #BEE8CB; }
  .badge-observed { background: #EAF1FD; color: #2D6FE0; border: 1px solid #C6DBFB; }
  .badge-inferred { background: #FFF6DC; color: #96690A; border: 1px solid #F0DBA0; }
  .badge-conflict  { background: #FDEAEA; color: #C63C3C; border: 1px solid #F5C2C2; }
  .badge-unknown   { background: #F1F2F4; color: #6B7280; border: 1px solid #DCE0E5; }

  /* Fact row */
  .fact-card { border: 1px solid #E2E5EA; border-radius: 8px; padding: 10px; }
  .fact-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .fact-kv { font-size: 11.5px; color: #3A4250; overflow-wrap: break-word; }
  .fact-key { color: #8B95A1; }
  .fact-source { font-size: 10.5px; color: #8B95A1; margin-top: 5px; }
  .fact-note { font-size: 10.5px; color: #7A8290; margin-top: 2px; }

  /* Keyword chips */
  .chip { background: #F1F2F4; color: #5B6472; border-radius: 12px; padding: 4px 10px; font-size: 11px; }
  .keyword-blocked { border-radius: 8px; padding: 9px; }

  /* Candidate keyword card */
  .kw-cand { border: 1px solid #E2E5EA; border-radius: 8px; padding: 9px; display: flex; flex-direction: column; gap: 4px; }
  .kw-cand-name { font-size: 11.5px; font-weight: 600; color: #1A2433; }
  .kw-cand-meta { display: flex; gap: 10px; font-size: 10.5px; color: #5B6472; }

  /* Content sub-tabs */
  .subtab-bar { display: flex; gap: 3px; background: #F1F2F4; border-radius: 8px; padding: 3px; }
  .subtab-btn {
    flex: 1; text-align: center; font-size: 10.5px; font-weight: 600;
    padding: 6px 1px; border-radius: 6px; cursor: pointer;
    background: transparent; color: #5B6472; border: none; outline: none;
    transition: background 0.15s, color 0.15s;
  }
  .subtab-btn.active { background: #0F2540; color: #FFFFFF; }
  .subtab-btn:hover:not(.active) { background: #E4E6EA; }

  /* Title suggestion card */
  .suggestion-card { border: 1px solid #E2E5EA; border-radius: 8px; padding: 11px; display: flex; flex-direction: column; gap: 7px; }
  .style-tag { font-size: 10px; font-weight: 700; color: #0E8E82; background: #EFF9F7; border-radius: 4px; padding: 2px 7px; align-self: flex-start; }
  .suggestion-text { font-size: 11.5px; color: #1A2433; line-height: 1.5; overflow-wrap: break-word; }
  .suggestion-facts { display: flex; flex-direction: column; gap: 3px; }
  .fact-used { font-size: 10.5px; color: #1C6E42; }
  .fact-excluded { font-size: 10.5px; color: #B04040; }
  .suggestion-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .action-btn {
    font-size: 10.5px; font-weight: 600; color: #0F2540;
    border: 1px solid #D8DCE2; border-radius: 5px;
    padding: 5px 9px; cursor: pointer; background: #FFFFFF;
    transition: background 0.15s;
  }
  .action-btn:hover { background: #F1F2F4; }

  /* Translation lang chips */
  .lang-chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .lang-chip {
    font-size: 10.5px; font-weight: 600;
    padding: 5px 9px; border-radius: 13px; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  /* Debug */
  .evidence-table { border: 1px solid #E2E5EA; border-radius: 8px; overflow: hidden; }
  .evidence-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 6px; padding: 7px 10px; border-bottom: 1px solid #EEF0F3;
    font-size: 10.5px; color: #3A4250;
  }
  .evidence-row:last-child { border-bottom: none; }
  .ev-label { flex: none; width: 56px; overflow-wrap: break-word; }
  .ev-source { flex: 1; color: #8B95A1; overflow-wrap: break-word; text-align: right; }
  .ev-ts { flex: none; color: #B7BEC7; font-family: ui-monospace, monospace; }

  /* Tool status row */
  .tool-row {
    display: flex; justify-content: space-between; align-items: center;
    border: 1px solid #E2E5EA; border-radius: 6px; padding: 7px 9px;
  }
  .tool-name { font-size: 10.5px; color: #3A4250; }

  /* Reasoning steps */
  .reasoning-step {
    font-size: 10.5px; color: #3A4250;
    padding: 4px 0; border-bottom: 1px solid #EEF0F3;
    display: flex; justify-content: space-between; gap: 6px;
  }
  .reasoning-step:last-child { border-bottom: none; }
  .step-phase { color: #0E8E82; font-weight: 700; }

  /* Identity confirmation overlay */
  #identity-modal {
    position: absolute; inset: 0;
    background: #FFFFFF; z-index: 50;
    display: flex; flex-direction: column;
    padding: 18px; gap: 12px;
    overflow-y: auto;
  }
  #identity-modal.hidden { display: none; }
  .modal-header { display: flex; justify-content: space-between; align-items: baseline; }
  .modal-title { font-size: 14.5px; font-weight: 700; color: #0F2540; }
  .modal-close { cursor: pointer; color: #8B95A1; font-size: 12px; }
  .modal-close:hover { color: #0F2540; }
  .modal-subtitle { font-size: 11px; color: #5B6472; line-height: 1.5; }
  .candidate-card {
    border: 2px solid #E2E5EA; border-radius: 8px; padding: 11px;
    cursor: pointer; display: flex; flex-direction: column; gap: 5px;
    transition: border-color 0.15s;
  }
  .candidate-card.selected { border-color: #0E8E82; }
  .candidate-top { display: flex; align-items: center; gap: 9px; }
  .radio-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #0E8E82; background: #FFFFFF;
    display: inline-block; flex: none; transition: background 0.15s;
  }
  .radio-dot.filled { background: #0E8E82; }
  .candidate-name { font-size: 12.5px; font-weight: 600; color: #1A2433; flex: 1; overflow-wrap: break-word; }
  .candidate-pct { font-size: 11px; font-weight: 700; color: #0F2540; flex: none; }
  .cand-support { font-size: 10.5px; color: #1C6E42; padding-left: 23px; }
  .cand-oppose  { font-size: 10.5px; color: #B04040; padding-left: 23px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .btn-cancel {
    font-size: 11.5px; font-weight: 600; color: #5B6472;
    border: 1px solid #D8DCE2; border-radius: 6px; padding: 7px 14px;
    cursor: pointer; background: #FFFFFF;
  }
  .btn-cancel:hover { background: #F7F8FA; }
  .btn-confirm {
    font-size: 11.5px; font-weight: 600; color: #FFFFFF;
    border-radius: 6px; padding: 7px 14px; cursor: pointer;
    border: none; transition: background 0.15s;
  }

  /* Helpers */
  .flex-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .flex-col { display: flex; flex-direction: column; gap: 8px; }
  .section-title { font-size: 10px; font-weight: 700; color: #5B6472; margin-bottom: 6px; }
  .summary-text { font-size: 11px; color: #5B6472; line-height: 1.6; background: #F7F8FA; border-radius: 8px; padding: 11px; }
  .divider-dashed { border-top: 1px dashed #D8DCE2; padding-top: 12px; margin-top: 4px; }
  .text-mono { font-family: ui-monospace, monospace; }
  s { color: #8B95A1; }
  b.teal { color: #0E8E82; }
  .green { color: #1C6E42; }
  .red-text { color: #B04040; }
</style>
</head>
<body>
<div id="app">
  <!-- Address bar -->
  <div class="addr-bar">
    <span class="addr-dot"></span>
    <span class="addr-text" id="addr-text">made-in-china.com/showroom/products/edit?id=8823910</span>
  </div>

  <!-- Header -->
  <div class="panel-header">
    <div class="panel-title">
      <span class="panel-title-dot"></span>
      <span class="panel-title-text">AI 店铺医生</span>
    </div>
    <div class="scene-badge" id="scene-toggle"></div>
  </div>

  <!-- Summary bar -->
  <div class="summary-bar">
    <div class="summary-top">
      <div class="summary-name" id="summary-name"></div>
      <div class="summary-pct">82%</div>
    </div>
    <div id="summary-badge"></div>
    <div class="summary-sub" id="summary-sub"></div>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar" id="tab-bar"></div>

  <!-- Content area -->
  <div class="content-area" id="content-area"></div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <button class="btn-ghost" id="btn-export">导出证据包</button>
    <button class="btn-primary" id="btn-sync" onclick="openAdmin()">运营驾驶舱</button>
  </div>

  <!-- Identity confirmation modal -->
  <div id="identity-modal" class="hidden"></div>
</div>

<script src="state.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
