<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hidden password modal product</title>
</head>
<body>
  <div class="hidden" hidden style="display:none" aria-hidden="true">
    <form id="changePassword">
      <label>New password <input type="password" name="newPassword" value=""></label>
    </form>
  </div>
  <form id="productForm" class="product-main">
    <h1>LED Panel Light 60x60</h1>
    <input name="subject" value="LED Panel Light 60x60">
    <input name="keywords" value="led panel, 60x60 ceiling light">
    <input name="sku" value="LED-6060-SAMPLE">
    <table>
      <tr><th>Size</th><td>60x60 cm</td></tr>
      <tr><th>Voltage</th><td>220-240V</td></tr>
    </table>
    <img src="https://img.made-in-china.com/sample/led-panel.jpg" alt="LED panel">
  </form>
</body>
</html>
