<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>商品列表 - VEMIC 示例</title>
</head>
<body>
  <header class="admin-header">
    <div>商品中心</div>
    <input type="search" placeholder="搜索商品名称" value="">
  </header>
  <aside>全部商品 / 草稿 / 已发布</aside>
  <main>
    <h1>商品列表</h1>
    <table>
      <tr><th>商品</th><th>状态</th><th>操作</th></tr>
      <tr><td>Canister Vacuum Cleaner 20L</td><td>已发布</td><td>编辑</td></tr>
      <tr><td>LED Panel Light 60x60</td><td>草稿</td><td>编辑</td></tr>
      <tr><td>Reflective Safety Vest Class 2</td><td>已发布</td><td>编辑</td></tr>
    </table>
    <p>这是后台列表页，不是商品详情或编辑页。页面没有商品规格表单。</p>
  </main>
</body>
</html>
