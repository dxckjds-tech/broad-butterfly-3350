<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>编辑商品</title></head>
<body>
  <form id="productForm" class="product-edit-form">
    <label>产品名称<input name="prodName" value="Operation Table Valve"></label>
    <div class="form-item">
      <label>产品类目</label>
      <span class="cate-selected">Valves &gt; Check Valves</span>
    </div>
    <label>关键词<input name="keywords" value="check valve, operation"></label>
    <table>
      <tr><th>属性</th><th>值</th><th>操作</th></tr>
      <tr><td>Power</td><td>1200W</td><td>删除</td></tr>
      <tr><td>Material</td><td>SS304</td><td>删除</td></tr>
    </table>
    <textarea name="prodDesc">Edit page with an operation column that must not be treated as a list.</textarea>
  </form>
</body>
</html>
